<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Guru SMA IT Al Hidayah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f1f5f9; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    .input-field { width: 100%; padding: 1rem; border-radius: 0.75rem; background: #0f172a; border: 1px solid #334155; outline: none; transition: 0.2s; }
    .input-field:focus { border-color: #06b6d4; box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2); }
    .title-gradient { 
      background: linear-gradient(to right, #22d3ee, #818cf8); 
      -webkit-background-clip: text; 
      background-clip: text; 
      -webkit-text-fill-color: transparent; 
    }
  </style>
</head>
<body class="h-full">
  <main class="max-w-xl mx-auto p-4 pb-20">
    <header class="text-center py-10">
      <div class="inline-block p-4 rounded-3xl bg-gradient-to-br from-cyan-500/20 to-indigo-500/20 mb-6 shadow-inner">
        <span class="text-5xl">📖</span>
      </div>
      <h1 class="text-3xl font-bold tracking-tight title-gradient">ABSENSI GURU</h1>
      <h2 class="text-lg font-semibold text-white/80 mt-1">SMA IT Al Hidayah Pamenang</h2>
      <div class="mt-4 flex justify-center">
        <div id="live-clock" class="px-4 py-1 rounded-full bg-slate-800 text-xs font-mono text-cyan-400 border border-slate-700 shadow-lg">00:00:00</div>
      </div>
    </header>

    <div class="glass rounded-[2rem] p-8 shadow-2xl border border-white/5">
      <form id="attendance-form" class="space-y-6">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-[0.2em] mb-3 text-cyan-400/80">Nama Lengkap</label>
          <input type="text" id="teacher-name" required placeholder="Tuliskan Nama Lengkap Anda" class="input-field">
        </div>

        <div>
          <label class="block text-[10px] font-bold uppercase tracking-[0.2em] mb-3 text-cyan-400/80">Status Kehadiran</label>
          <div class="grid grid-cols-3 gap-3">
            <label class="cursor-pointer group">
              <input type="radio" name="status" value="Hadir" required class="peer hidden">
              <div class="py-3 text-center rounded-xl border border-slate-700 peer-checked:bg-green-500 peer-checked:border-green-400 transition-all text-[11px] font-bold group-hover:border-slate-500">HADIR</div>
            </label>
            <label class="cursor-pointer group">
              <input type="radio" name="status" value="Sakit" class="peer hidden">
              <div class="py-3 text-center rounded-xl border border-slate-700 peer-checked:bg-red-500 peer-checked:border-red-400 transition-all text-[11px] font-bold group-hover:border-slate-500">SAKIT</div>
            </label>
            <label class="cursor-pointer group">
              <input type="radio" name="status" value="Izin" class="peer hidden">
              <div class="py-3 text-center rounded-xl border border-slate-700 peer-checked:bg-orange-500 peer-checked:border-orange-400 transition-all text-[11px] font-bold group-hover:border-slate-500">IZIN</div>
            </label>
          </div>
        </div>

        <div id="geofence-card" class="p-4 rounded-xl bg-black/30 border border-white/10">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[10px] font-bold uppercase opacity-50 tracking-widest text-cyan-400">Status Lokasi</span>
            <span id="status-tag" class="text-[9px] px-2 py-1 rounded bg-slate-700 font-bold uppercase tracking-tighter">Standby</span>
          </div>
          <p id="distance-info" class="text-[11px] text-white/60 leading-relaxed italic">Lokasi akan dicatat otomatis saat menekan tombol masuk.</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <button type="button" id="btn-masuk" class="py-4 rounded-2xl font-bold bg-cyan-600 hover:bg-cyan-500 active:scale-95 transition-all text-sm shadow-lg border-b-4 border-cyan-800 text-white">🚪 MASUK</button>
          <button type="button" id="btn-pulang" disabled class="py-4 rounded-2xl font-bold bg-indigo-600 opacity-20 cursor-not-allowed transition-all text-sm shadow-lg border-b-4 border-indigo-800 text-white">🏠 PULANG</button>
        </div>

        <div id="location-display" class="text-[11px] text-cyan-400 font-medium text-center hidden p-3 rounded-lg bg-slate-800/50 mt-2">
          📍 Alamat Terdeteksi:<br><span id="address-text" class="text-white/80 font-normal">Mencari alamat...</span>
        </div>

        <input type="hidden" id="jam-masuk">
        <input type="hidden" id="jam-pulang">
        <input type="hidden" id="lokasi-data">

        <button type="submit" id="submit-btn" disabled class="w-full py-5 rounded-2xl font-bold text-lg bg-emerald-600 opacity-20 cursor-not-allowed hover:bg-emerald-500 transition-all shadow-2xl mt-4 border-b-4 border-emerald-800 text-white">
          SIMPAN KE SPREADSHEET
        </button>
      </form>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyu06IktusxV2CFVzLKEcviUdt6D-tdBJ3xXY7ntfo7oKzA9lJ8PxIdDKObqEXrB0Ux/exec";
    
    const btnMasuk = document.getElementById('btn-masuk');
    const btnPulang = document.getElementById('btn-pulang');
    const submitBtn = document.getElementById('submit-btn');
    const addressText = document.getElementById('address-text');
    const locationDisplay = document.getElementById('location-display');
    const statusTag = document.getElementById('status-tag');
    const distanceInfo = document.getElementById('distance-info');

    setInterval(() => {
      document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false });
    }, 1000);

    function validateForm() {
      const name = document.getElementById('teacher-name').value;
      const status = document.querySelector('input[name="status"]:checked');
      const hasMasuk = document.getElementById('jam-masuk').value;
      
      if (name && status && hasMasuk) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-20', 'cursor-not-allowed');
      }
    }

    document.getElementById('teacher-name').addEventListener('input', validateForm);
    document.getElementById('attendance-form').addEventListener('change', validateForm);

    btnMasuk.addEventListener('click', () => {
      btnMasuk.innerText = "⏳ Memvalidasi...";
      btnMasuk.disabled = true;

      if (!navigator.geolocation) {
        alert("Browser Anda tidak mendukung GPS");
        btnMasuk.disabled = false;
        btnMasuk.innerText = "🚪 MASUK";
        return;
      }

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const userLat = pos.coords.latitude;
        const userLon = pos.coords.longitude;

        const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('jam-masuk').value = time;
        locationDisplay.classList.remove('hidden');

        statusTag.innerText = "LOKASI DICATAT";
        statusTag.className = "text-[9px] px-2 py-1 rounded bg-green-500 text-white font-bold uppercase";
        distanceInfo.innerHTML = `Koordinat: <span class="text-green-400">${userLat.toFixed(4)}, ${userLon.toFixed(4)}</span>`;

        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${userLat}&lon=${userLon}`, {
              headers: { 'Accept-Language': 'id' }
          });
          const data = await response.json();
          const address = data.display_name || `${userLat}, ${userLon}`;
          
          document.getElementById('lokasi-data').value = address;
          addressText.innerText = address;
        } catch (e) {
          document.getElementById('lokasi-data').value = `${userLat}, ${userLon}`;
          addressText.innerText = "Alamat tidak terbaca, koordinat tersimpan.";
        }

        btnMasuk.innerText = "✅ MASUK BERHASIL";
        btnMasuk.className = "py-4 rounded-2xl font-bold bg-slate-800 text-green-400 cursor-default border-b-4 border-slate-900";
        btnPulang.disabled = false;
        btnPulang.classList.remove('opacity-20', 'cursor-not-allowed');
        validateForm();

      }, (err) => {
        alert("Gagal ambil lokasi. Pastikan GPS aktif.");
        btnMasuk.disabled = false;
        btnMasuk.innerText = "🚪 COBA LAGI";
      }, { enableHighAccuracy: true });
    });

    btnPulang.addEventListener('click', () => {
      const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('jam-pulang').value = time;
      btnPulang.innerText = "✅ PULANG OK";
      btnPulang.className = "py-4 rounded-2xl font-bold bg-slate-800 text-indigo-400 cursor-default border-b-4 border-slate-900";
      btnPulang.disabled = true;
      validateForm();
    });

    document.getElementById('attendance-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.innerText = "⏳ MENGIRIM...";
      submitBtn.disabled = true;

      const record = {
        nama: document.getElementById('teacher-name').value,
        status: document.querySelector('input[name="status"]:checked').value,
        jam_masuk: document.getElementById('jam-masuk').value,
        jam_pulang: document.getElementById('jam-pulang').value || "-",
        lokasi: document.getElementById('lokasi-data').value,
        tanggal: new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
      };

      const formData = new URLSearchParams();
      for (const key in record) { formData.append(key, record[key]); }

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });
        alert("✅ Absensi Berhasil Disimpan!");
       } catch (err) {
        alert("Gagal mengirim data ke server.");
        submitBtn.disabled = false;
        submitBtn.innerText = "SIMPAN KE SPREADSHEET";
      }
    });
  </script>
</body>
</html>
